name: wax-alcor-v2-range-optimizer
trust_label: educational-reference
version: 0.1.0
purpose: >
  Reduce the larger of high/entry and entry/low. Do not call it a tick.
invariants:
  - src/range.ts performs no network or wallet calls.
  - Requests in src/usecases.ts set executed to false.
  - No use case contains a transaction.
do_not:
  - Do not add a live client and keep this trust label.
entrypoints:
  logic: src/range.ts
  tests: src/range.test.ts
  demo: src/Demo.tsx
  queries: src/usecases.ts
commands:
  test: npm test
  demo: npm run dev
live_data:
  status: untested
  notes: No endpoint was called.
